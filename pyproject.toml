[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sindympc"
version = "0.1.0"
description = "JAX-based SINDy MPC experiments for vehicle control."
readme = "README.md"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
include = ["sindympc*"]
